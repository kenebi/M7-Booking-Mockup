<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mindflight7 | Book a VR incursion (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#231F20; --paper:#FFFFFF; --mist:#F4F2F5; --line:#E2DCE4; --muted:#686170;
  --brand:#DF1BA2; --brand-ink:#A80F78; --brand-soft:#FCE9F5;
  --orbit:#24133A; --orbit-ink:#F3ECF8; --orbit-muted:#B9A9C9;
  --save:#0B7A52; --save-soft:#E2F3EB; --warn:#9A5300; --warn-soft:#FFF2DF;
  --focus:#7A3CFF;
  --r-s:8px; --r-m:12px; --r-l:20px;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#F1EDF3; --paper:#1B1520; --mist:#120E16; --line:#352C3C; --muted:#A99FB0;
    --brand:#F04DB8; --brand-ink:#FF8AD3; --brand-soft:#3A1431;
    --orbit:#0C0712; --orbit-ink:#F3ECF8; --orbit-muted:#A796B8;
    --save:#4CD49A; --save-soft:#11301F; --warn:#FFB65C; --warn-soft:#3A2810;
  }
}
:root[data-theme="dark"]{
  --ink:#F1EDF3; --paper:#1B1520; --mist:#120E16; --line:#352C3C; --muted:#A99FB0;
  --brand:#F04DB8; --brand-ink:#FF8AD3; --brand-soft:#3A1431;
  --orbit:#0C0712; --orbit-ink:#F3ECF8; --orbit-muted:#A796B8;
  --save:#4CD49A; --save-soft:#11301F; --warn:#FFB65C; --warn-soft:#3A2810;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--mist);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* team banner */
.mockbar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 20px;background:var(--orbit);color:var(--orbit-ink);font-size:14px}
.mockbar button{background:none;border:1px solid var(--orbit-muted);color:var(--orbit-ink);border-radius:999px;padding:4px 12px;cursor:pointer}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1120px;margin:0 auto;padding:22px 20px 8px}
.brandmark{font:700 19px/1 var(--display);letter-spacing:-.01em}
.brandmark span{color:var(--brand)}
.top .sub{color:var(--muted);font-size:14px}
.linkbtn{background:none;border:0;color:var(--brand-ink);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

/* layout */
.shell{max-width:1120px;margin:0 auto;padding:8px 20px 64px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}
.grid.with-cart{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:900px){.grid.with-cart{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:28px}
@media (max-width:560px){.panel{padding:20px}}

/* progress */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 22px;padding:0;list-style:none}
.steps li{font-size:13px;color:var(--muted);padding-top:10px;border-top:4px solid var(--line)}
.steps li.done{border-color:var(--brand);color:var(--ink)}
.steps li.now{border-color:var(--brand);color:var(--ink);font-weight:700}
.steps b{font-weight:inherit}

h1,h2,h3{margin:0}
.title{font:500 clamp(24px,3.4vw,32px)/1.15 var(--display);letter-spacing:-.02em;margin-bottom:8px}
.lede{color:var(--muted);margin:0 0 24px;max-width:60ch}
.h3{font:700 17px/1.3 var(--body);margin:0 0 4px}
.hint{color:var(--muted);font-size:14px;margin:4px 0 0}

/* fields */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.fields .full{grid-column:1/-1}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
label.f,span.f{display:block;font-weight:600;font-size:15px}
.panel.bare{background:none;border:0;padding:0}
label.f .optional{font-weight:400;color:var(--muted)}
.input,.select,.textarea{display:block;width:100%;margin-top:6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--paper)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.textarea{min-height:84px;resize:vertical}
.err{color:#C0244A;font-size:13px;margin-top:4px;min-height:0}
.input.bad{border-color:#C0244A}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--brand);flex:none}
.group{margin-top:26px}
.group:first-child{margin-top:0}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.chip:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--mist);flex-wrap:wrap;margin-top:8px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(35,31,32,.15)}
@media (max-width:560px){.seg{display:grid;grid-template-columns:repeat(3,1fr);border-radius:14px;width:100%}.seg button{border-radius:11px;padding:8px 6px;font-size:14px;line-height:1.2}}

.flights{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.flight{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:var(--r-m);padding:14px;cursor:pointer}
.flight b{display:block;font-size:16px}
.flight span{color:var(--muted);font-size:13px}
.flight[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--brand-soft)}
.flight.help{border-style:dashed}

.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-s);margin-top:6px;background:var(--paper)}
.stepper button{width:44px;height:46px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--brand-ink)}
.stepper input{width:80px;border:0;text-align:center;font-weight:700;font-size:18px;background:none;padding:10px 0}
.stepper input:focus{outline:none}

.nudge{display:flex;gap:10px;align-items:flex-start;background:var(--save-soft);color:var(--save);border-radius:var(--r-s);padding:10px 12px;font-size:14px;font-weight:600;margin-top:10px}
.nudge::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor;margin-top:6px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-s);padding:10px 12px;font-size:14px;margin-top:10px;font-weight:500}
.good{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:var(--r-s);padding:10px 12px;font-size:14px;margin-top:10px;font-weight:600}
.good::before{content:"\2713";display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--save);color:#fff;font-size:12px;flex:none}
.perk{display:flex;gap:10px;align-items:center;background:var(--save-soft);color:var(--save);border-radius:var(--r-s);padding:8px 12px;font-size:14px;font-weight:600;margin-top:8px}
.perk .pct{background:var(--save);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;flex:none;white-space:nowrap}
.deal{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:10px;padding:12px 12px 12px 14px;border:2px solid var(--brand);background:var(--brand-soft);border-radius:var(--r-m);color:var(--ink);font-size:14px;line-height:1.4}
.deal-badge{font:700 13px/1 var(--display);background:var(--brand);color:#fff;border-radius:8px;padding:8px 9px;white-space:nowrap;transform:rotate(-2deg)}
.deal-text b{color:var(--brand-ink);font-weight:800}
.deal-btn{border:0;background:var(--brand);color:#fff;font-weight:700;border-radius:999px;padding:10px 16px;cursor:pointer;white-space:nowrap;font-size:14px;box-shadow:0 4px 12px rgba(223,27,162,.28)}
.deal-btn:hover{background:var(--brand-ink);transform:translateY(-1px)}
.deal.fresh .deal-badge{animation:wiggle .7s ease-in-out 2}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}30%{transform:rotate(-9deg) scale(1.1)}60%{transform:rotate(5deg) scale(1.05)}}
.perk.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.day.eb{box-shadow:inset 0 0 0 2px var(--brand)}
@media (max-width:560px){.deal{grid-template-columns:auto 1fr}.deal-btn{grid-column:1/-1;justify-self:start}}
.perk.hint{background:none;border:1.5px dashed var(--line);color:var(--muted);font-weight:500}
.perk.hint .pct{background:none;border:1.5px solid var(--save);color:var(--save)}
.checking{color:var(--muted);font-size:14px;margin-top:10px;display:flex;gap:8px;align-items:center}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

.prefill{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--brand-soft);color:var(--brand-ink);border-radius:var(--r-m);padding:12px 16px;margin-bottom:22px;font-weight:600}
.skip{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:var(--r-m);padding:12px 16px;margin-bottom:24px;font-size:15px}

/* calendar */
.cal{border:1.5px solid var(--line);border-radius:var(--r-m);padding:12px;max-width:380px;margin-top:8px;background:var(--paper)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-head b{font-size:15px}
.cal-head button{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px}
.cal-head button:disabled{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-grid .dow{font-size:12px;color:var(--muted);padding:4px 0}
.day{position:relative;border:0;background:none;border-radius:8px;height:40px;cursor:pointer;font-weight:600;font-size:14px}
.day:hover:not(:disabled){background:var(--mist)}
.day:disabled{color:var(--line);cursor:default;font-weight:400}
.day.sel,.day.sel:hover:not(:disabled){background:var(--brand);color:#fff}
.day.req{box-shadow:inset 0 0 0 2px var(--warn);color:var(--warn)}
.day.off::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--save)}
.day.sel.off::after{background:#fff}
.cal-legend{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center}
.cal-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--save)}

.sessions{margin-top:10px;border:1.5px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.sessions .row{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.sessions .row:first-child{border-top:0}
.sessions .row span{color:var(--muted)}

.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:14px 26px;font-weight:700;font-size:16px;cursor:pointer;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-ink)}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--mist)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* school search */
.search-wrap{position:relative}
.results{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-s);margin-top:4px;max-height:280px;overflow:auto;box-shadow:0 12px 30px rgba(35,31,32,.12)}
.results button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 14px;cursor:pointer}
.results button:first-child{border-top:0}
.results button:hover,.results button:focus{background:var(--mist)}
.results small{display:block;color:var(--muted)}
.picked{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1.5px solid var(--brand);background:var(--brand-soft);border-radius:var(--r-m);padding:14px 16px;margin-top:10px}
.picked b{display:block}
.picked small{color:var(--muted)}

/* cart */
.cart{position:sticky;top:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.cart-head{background:var(--orbit);color:var(--orbit-ink);padding:18px 20px}
.cart-head small{color:var(--orbit-muted);display:block;font-size:13px}
.cart-head b{font:500 19px/1.25 var(--display);display:block;margin-top:2px}
.cart-body{padding:16px 20px}
.cart-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0}
.cart-row span:first-child{color:var(--muted)}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
.cart-total b{font:500 24px/1 var(--display)}
.cart-note{font-size:13px;color:var(--muted);margin-top:10px}
@media (max-width:900px){.cart{position:static}}

/* loading */
.preflight{max-width:560px;margin:40px auto;text-align:left}
.preflight ol{list-style:none;padding:0;margin:24px 0 0}
.preflight li{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);color:var(--muted);transition:color .3s}
.preflight li .mk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;font-weight:700}
.preflight li.on{color:var(--ink)}
.preflight li.on .mk{border-color:var(--brand);border-top-color:transparent;animation:spin .8s linear infinite}
.preflight li.ok{color:var(--ink)}
.preflight li.ok .mk{border-color:var(--save);background:var(--save);color:#fff;animation:none}
.preflight li small{display:block;color:var(--muted);font-size:13px}

/* ticket / review */
.ticket{background:var(--paper);border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line)}
.ticket-top{background:var(--orbit);color:var(--orbit-ink);padding:26px 28px 30px;position:relative}
.ticket-top small{color:var(--orbit-muted);font-size:14px}
.ticket-top .flightname{font:700 clamp(26px,4.6vw,40px)/1.05 var(--display);letter-spacing:-.02em;margin:6px 0 18px}
.legs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:640px){.legs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.legs div small{display:block;color:var(--orbit-muted);font-size:12px}
.legs div b{font-size:15px}
.perf{height:22px;background:
  radial-gradient(circle at 0 50%,var(--mist) 11px,transparent 12px) left/22px 22px no-repeat,
  radial-gradient(circle at 100% 50%,var(--mist) 11px,transparent 12px) right/22px 22px no-repeat,
  linear-gradient(90deg,transparent 18px,var(--line) 18px,var(--line) calc(100% - 18px),transparent calc(100% - 18px)) center/100% 2px no-repeat;
  background-color:var(--paper)}
.ticket-body{padding:8px 28px 28px}
@media (max-width:560px){.ticket-top,.ticket-body{padding-left:20px;padding-right:20px}}

.lines{margin:6px 0 0;padding:0;list-style:none}
.line{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.line:first-child{border-top:0}
.line .what small{display:block;color:var(--muted);font-size:13px}
.line .amt{font-weight:700;white-space:nowrap;text-align:right}
.line.offer .amt{color:var(--save)}
.line.offer .what b{color:var(--save)}
.line .was{text-decoration:line-through;color:var(--muted);font-weight:500;margin-right:6px}
@media (max-width:560px){.line .amt .stamp{display:block;width:max-content;margin:4px 0 0 auto}}
.stamp{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--save);border:1.5px solid var(--save);border-radius:6px;padding:1px 6px;transform:rotate(-3deg)}
.reveal .line{opacity:0;transform:translateY(6px)}
.reveal .line.in{opacity:1;transform:none;transition:opacity .35s,transform .35s}
.reveal .line.offer.in .stamp{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:scale(2.2) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
.totalbox{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:8px;padding-top:16px;border-top:2px solid var(--ink)}
.totalbox small{color:var(--muted);display:block;font-size:13px}
.totalbox .big{font:700 clamp(30px,5vw,40px)/1 var(--display);letter-spacing:-.02em}
.savebanner{margin-top:16px;background:var(--save-soft);color:var(--save);border-radius:var(--r-m);padding:14px 16px;font-weight:700;opacity:0;transition:opacity .5s}
.savebanner.in{opacity:1}
.promo{display:flex;gap:8px;margin-top:6px}
.promo .input{margin-top:0;text-transform:uppercase}
.promo .btn{padding:10px 18px;font-size:15px}

.twocol{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px}
@media (max-width:700px){.twocol{grid-template-columns:1fr}}
.kv{margin:0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv div:first-child{border-top:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600;max-width:60%}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,10,28,.55);display:grid;place-items:center;padding:20px;z-index:50;overflow:auto}
.modal{background:var(--paper);border-radius:var(--r-l);max-width:820px;width:100%;padding:26px;position:relative;max-height:calc(100vh - 40px);overflow:auto}
.modal .close{position:absolute;top:14px;right:14px;border:0;background:var(--mist);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;margin-top:18px}
@media (max-width:720px){.split{grid-template-columns:1fr}}
.side{border:1.5px solid var(--line);border-radius:var(--r-m);padding:18px}
.side.alt{background:var(--mist)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* email preview */
.email{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin-top:14px}
.email .meta{background:var(--mist);padding:12px 16px;font-size:14px}
.email .meta div{color:var(--muted)}
.email .meta b{color:var(--ink)}
.email .bodym{padding:20px}
.email .bodym .btn{display:inline-block;text-decoration:none;margin:12px 0}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--orbit);color:var(--orbit-ink);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:60;max-width:calc(100% - 40px)}
#toast.show{opacity:1;transform:translateX(-50%)}

/* setup */
.setup-head{max-width:1120px;margin:0 auto;padding:28px 20px 6px}
.setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:820px){.setup-grid{grid-template-columns:1fr}}
.opt-list{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r-m);padding:12px 14px;cursor:pointer;background:var(--paper)}
.opt input{margin-top:4px;accent-color:var(--brand);width:18px;height:18px;flex:none}
.opt b{display:block;font-size:15px}

@keyframes okstamp{from{transform:scale(2.4) rotate(-20deg);opacity:0}to{transform:rotate(-8deg);opacity:1}}

<body>
<div class="mockbar" id="mockbar" hidden>
  <span>Mockup for team testing. Nothing is booked and no emails are sent.</span>
  <button type="button" id="toSetup">Change setup</button>
</div>
<main id="app"></main>
<div id="modalRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ---------- sample data (placeholders until the rules sheet exists) ---------- */
var FLIGHTS = [
  {slug:"junior-space-explorer", name:"Junior Space Explorer", type:"primary",   years:"F to 2",  lengths:[30,45,60]},
  {slug:"ecovoyage",             name:"EcoVoyage",             type:"primary",   years:"3 to 6",  lengths:[45,60,90]},
  {slug:"ocean-depths",          name:"Ocean Depths",          type:"primary",   years:"3 to 6",  lengths:[45,60]},
  {slug:"space-explorer",        name:"Space Explorer",        type:"secondary", years:"7 to 10", lengths:[60,90]},
  {slug:"inside-the-cell",       name:"Inside the Cell",       type:"secondary", years:"7 to 10", lengths:[45,60,90]},
  {slug:"ancient-worlds",        name:"Ancient Worlds",        type:"secondary", years:"7 to 10", lengths:[45,60]},
  {slug:"careers-in-stem",       name:"Careers in STEM",       type:"secondary", years:"9 to 12", lengths:[60,90]}
];
var PRICE = {30:14, 45:18, 60:22, 90:27.5};
var MINIMUM = 880, GST = 0.10, LEAD_DAYS = 14, EARLY_DAYS = 60, BUFFER = 15;
var PD_VALUE = 440, FREE_KM = 50, PER_KM = 1.5, TRAVEL_CAP = 300;
var MAX_PER_SESSION = {NSW:30, VIC:50, WA:34, SA:30, QLD:40, Other:30};
var ACTIVE_STATES = ["NSW","VIC","WA","SA","QLD"];
var BASES = {VIC:"Melbourne", NSW:"Sydney", QLD:"Brisbane", WA:"Perth", SA:"Adelaide"};
var SCHOOLS = [
  {name:"Riverbend Primary School",   suburb:"Box Hill",   state:"VIC", postcode:"3128", km:14},
  {name:"Goldfields Secondary College",suburb:"Ballarat",  state:"VIC", postcode:"3350", km:116},
  {name:"Harbourview Public School",  suburb:"Parramatta", state:"NSW", postcode:"2150", km:24},
  {name:"Blue Gum High School",       suburb:"Katoomba",   state:"NSW", postcode:"2780", km:102},
  {name:"Sunridge State School",      suburb:"Chermside",  state:"QLD", postcode:"4032", km:11},
  {name:"Swan Valley Primary School", suburb:"Midland",    state:"WA",  postcode:"6056", km:18},
  {name:"Kingsford Primary School",   suburb:"Glenelg",    state:"SA",  postcode:"5045", km:12},
  {name:"Derwent Valley Primary School",suburb:"New Norfolk",state:"TAS",postcode:"7140", km:null}
];
var HOLIDAYS = [
  {date:"2026-11-03", states:["VIC"], name:"Melbourne Cup Day"},
  {date:"2026-12-25", states:"all", name:"Christmas Day"},
  {date:"2026-12-28", states:"all", name:"the Boxing Day public holiday"},
  {date:"2027-01-01", states:"all", name:"New Year's Day"},
  {date:"2027-01-26", states:"all", name:"Australia Day"}
];
var FIXED_CAPACITY = {"2026-11-18":0, "2026-11-19":40};
var OFFERS = {
  pd:      {label:"Free Teacher PD session", desc:"Bonus with every incursion booked this term (worth $440)"},
  group:   {label:"Group discount, 25% off", desc:"50 or more students in one booking", pct:25},
  early:   {label:"Early bird, 10% off", desc:"Incursion date 60 or more days away", pct:10},
  offpeak: {label:"Monday and Friday, 10% off", desc:"Incursions held on a Monday or Friday", pct:10},
  code:    {label:"Promo code TERM4, 15% off", desc:"Entered by the booker at the price step", pct:15}
};
var ORIGINS = [
  {id:"none", label:"Book Now button (no flight)", sub:"Header or hub page"}
].concat(FLIGHTS.map(function(f){return {id:f.slug, label:f.name+" page", sub:"?flight="+f.slug};}))
 .concat([{id:"custom-workshop", label:"Custom workshops page", sub:"?flight=custom-workshop"}]);
var ROLES = ["Classroom teacher","Head of learning area","Digital or immersive learning coordinator","Careers coordinator","Principal or leadership","Business manager","OSHC or holiday program coordinator","Other"];

/* ---------- state ---------- */
var setup = {origin:"space-explorer", offers:{pd:true,group:true,early:true,offpeak:true,code:true},
             stacking:"stack", cart:true, weekend:"rep", dailyCap:150};
var form, view, calMonth, modalMonth, checkTimer;
function freshForm(){
  return {first:"",last:"",email:"",phone:"",role:"",remind:false,news:false,
    school:null, manual:false, venue:"School hall", parking:"", signin:"",
    type:"primary", flight:null, years:[], students:50, length:60, customNote:"", brief:"",
    sessionsWanted:0, date:null, dateStatus:null, dateRequest:false, start:"09:00",
    promo:"", promoApplied:"", po:"", terms:false, skipNote:"", callTime:"Morning", skipped:false, showEarly:false};
}

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x;}
function daysBetween(a,b){return Math.round((b-a)/86400000);}
var TODAY = (function(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());})();
var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function nice(s){if(!s)return "";var d=parse(s);return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();}
function niceShort(s){var d=parse(s);return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];}
function money(n){return n.toLocaleString("en-AU",{style:"currency",currency:"AUD",minimumFractionDigits:2,maximumFractionDigits:2});}
function round2(n){return Math.round(n*100)/100;}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function toMin(t){var p=t.split(":");return (+p[0])*60+(+p[1]);}
function fromMin(m){var h=Math.floor(m/60),mm=m%60,ap=h>=12?"pm":"am",hh=h%12||12;return hh+":"+pad(mm)+ap;}
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show");},3200);}
var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function wait(ms){return new Promise(function(r){setTimeout(r,reduced?Math.min(ms,80):ms);});}

function stateKey(){var s=form.school&&form.school.state;return MAX_PER_SESSION[s]?s:"Other";}
function stateLabel(){return form.school?form.school.state:"your state";}
function flightObj(){return FLIGHTS.filter(function(f){return f.slug===form.flight;})[0]||null;}
function isActiveState(){return form.school && ACTIVE_STATES.indexOf(form.school.state)>-1;}
function travelKm(){return form.school?form.school.km:null;}

/* ---------- availability (simulated) ---------- */
function remainingOn(dateStr,state){
  var cap = +setup.dailyCap||150;
  if (dateStr in FIXED_CAPACITY) return Math.min(cap,FIXED_CAPACITY[dateStr]);
  var h = hash(dateStr+"|"+state)%100;
  if (h<14) return 0;
  if (h<28) return Math.round(cap*0.3);
  if (h<42) return Math.round(cap*0.6);
  return cap;
}
function holidayOn(dateStr,state){
  for (var i=0;i<HOLIDAYS.length;i++){var h=HOLIDAYS[i];
    if (h.date===dateStr && (h.states==="all"||h.states.indexOf(state)>-1)) return h;}
  return null;
}
function availability(dateStr){
  var d=parse(dateStr), state=form.school?form.school.state:"VIC", n=+form.students||0;
  if (d<TODAY) return {ok:false,kind:"past"};
  var hol=holidayOn(dateStr,state);
  if (hol) return {ok:false,kind:"holiday",name:hol.name};
  var dow=d.getDay();
  if ((dow===0||dow===6) && setup.weekend!=="instant") return {ok:false,kind:setup.weekend==="rep"?"weekend":"weekendOff"};
  if (daysBetween(TODAY,d)<LEAD_DAYS) return {ok:false,kind:"lead"};
  var rem=remainingOn(dateStr,state);
  if (rem===0) return {ok:false,kind:"full"};
  if (n>rem) return {ok:false,kind:"partial",remaining:rem};
  return {ok:true,remaining:rem};
}
function reasonText(dateStr,a){
  var day=nice(dateStr), st=stateLabel();
  switch(a.kind){
    case "full": return day+" is fully booked in "+st+".";
    case "partial": return day+" only has room for "+a.remaining+" more students in "+st+".";
    case "holiday": return day+" is "+a.name+" in "+st+".";
    case "weekend": return "Weekend incursions are arranged directly with our team.";
    case "weekendOff": return "We don't run weekend incursions at the moment.";
    case "lead": return "Bookings less than two weeks away need a quick check with our team first.";
    default: return day+" isn't available.";
  }
}
function nearestAvailable(dateStr,count){
  var origin=parse(dateStr), found=[];
  for (var off=1; off<=90 && found.length<count*3; off++){
    [addDays(origin,off),addDays(origin,-off)].forEach(function(d){
      if (d<TODAY) return; var s=iso(d); if (availability(s).ok) found.push({s:s,dist:off});
    });
  }
  found.sort(function(a,b){return a.dist-b.dist||(a.s<b.s?-1:1);});
  return found.slice(0,count).map(function(x){return x.s;}).sort();
}

/* ---------- sessions and price ---------- */
function sessionPlan(){
  var max=MAX_PER_SESSION[stateKey()], n=Math.max(1,+form.students||0);
  var minS=Math.ceil(n/max), count=Math.max(minS, form.sessionsWanted||minS);
  var base=Math.floor(n/count), extra=n%count, len=form.length==="custom"?60:form.length;
  var t=toMin(form.start), rows=[];
  for (var i=0;i<count;i++){var c=base+(i<extra?1:0);rows.push({start:t,end:t+len,students:c});t+=len+BUFFER;}
  var last=rows[rows.length-1];
  return {rows:rows,count:count,minS:minS,max:max,headsets:rows[0].students,late:last.end>toMin("15:30"),
          arrive:rows[0].start-45};
}
function quoteOnly(){return form.type==="workshop"||form.length==="custom"||form.flight==="help";}
function isRequest(){return quoteOnly()||form.dateRequest||!isActiveState();}
function pricing(){
  if (quoteOnly()) return null;
  var p=PRICE[form.length], n=+form.students||0, raw=round2(n*p), base=Math.max(raw,MINIMUM);
  var cand=[];
  var o=setup.offers;
  var d=form.date?parse(form.date):null;
  if (o.group && n>=50) cand.push({key:"group",pct:25,label:"Group discount",why:n+" students, 50 or more"});
  if (o.early && d && daysBetween(TODAY,d)>=EARLY_DAYS) cand.push({key:"early",pct:10,label:"Early bird",why:"Booked "+daysBetween(TODAY,d)+" days ahead"});
  if (o.offpeak && d && (d.getDay()===1||d.getDay()===5)) cand.push({key:"offpeak",pct:10,label:DOW[d.getDay()]+" saver",why:"Monday and Friday incursions"});
  if (o.code && form.promoApplied==="TERM4") cand.push({key:"code",pct:15,label:"Promo code TERM4",why:"Code applied"});
  var used=cand;
  if (setup.stacking==="best" && cand.length>1){
    var best=cand.reduce(function(a,b){return b.pct>a.pct?b:a;});
    used=[best];
  }
  var running=base;
  used=used.map(function(x){var amt=round2(running*x.pct/100);running=round2(running-amt);return Object.assign({},x,{amt:amt});});
  var km=travelKm(), travel=null, travelNote="";
  if (!isActiveState()){travel=null;travelNote="Confirmed by our team";}
  else if (km<=FREE_KM){travel=0;travelNote=km+" km from our "+BASES[form.school.state]+" crew base, inside the free zone";}
  else {travel=Math.min(TRAVEL_CAP,round2((km-FREE_KM)*2*PER_KM));travelNote=km+" km from our "+BASES[form.school.state]+" crew base";}
  var ex=round2(running+(travel||0)), gst=round2(ex*GST), total=round2(ex+gst);
  return {p:p,n:n,raw:raw,base:base,minApplied:raw<MINIMUM,offers:used,skipped:cand.length-used.length,
          afterOffers:running,travel:travel,travelNote:travelNote,km:km,ex:ex,gst:gst,total:total,
          saved:round2(base-running),pd:!!o.pd};
}
function estimate(){
  if (quoteOnly()) return null;
  var p=PRICE[form.length], n=+form.students||0;
  return Math.max(round2(n*p),MINIMUM);
}

/* ---------- rendering shell ---------- */
function render(){
  clearTimeout(checkTimer);
  $("#mockbar").hidden = (view==="setup");
  var app=$("#app");
  if (view==="setup") app.innerHTML=setupHTML();
  else if (view==="loading"||view==="confirming") app.innerHTML=loadingHTML();
  else if (view==="done"||view==="requested") app.innerHTML=outcomeHTML();
  else if (view==="skip") app.innerHTML=pageWrap(skipHTML(),false);
  else app.innerHTML=pageWrap(stepHTML(),showCart());
  bind();
  window.scrollTo(0,0);
}
function showCart(){return setup.cart && view===3;}
function headerHTML(){
  return '<header class="top"><div><div class="brandmark">mind<span>flight</span>7</div>'+
    '<div class="sub">Book a VR incursion</div></div>'+
    ((view===1||view===2||view===3||view===4)?'<button type="button" class="linkbtn" data-act="saveLater">Save and finish later</button>':'')+
    '</header>';
}
function stepsHTML(){
  var labels=["Your details","School","Incursion",setup.cart?"Your cart":"Check and send"];
  return '<ol class="steps" aria-label="Booking steps">'+labels.map(function(l,i){
    var n=i+1, cls=n<view?"done":(n===view?"now":"");
    return '<li class="'+cls+'"'+(n===view?' aria-current="step"':'')+'><b>'+n+'. '+l+'</b></li>';
  }).join("")+'</ol>';
}
function pageWrap(inner,cart){
  return headerHTML()+'<div class="shell">'+(typeof view==="number"?stepsHTML():"")+
    '<div class="grid'+(cart?' with-cart':'')+'"><section class="panel'+(view===4&&setup.cart?' bare':'')+'">'+inner+'</section>'+
    (cart?'<aside class="cart" id="cart" aria-label="Your cart">'+cartHTML()+'</aside>':'')+'</div></div>';
}
function stepHTML(){
  if (view===1) return step1HTML();
  if (view===2) return step2HTML();
  if (view===3) return step3HTML();
  if (view===4) return step4HTML();
  return "";
}

/* ---------- setup page ---------- */
function setupHTML(){
  function radio(name,val,cur,label,sub){return '<label class="opt"><input type="radio" name="'+name+'" value="'+esc(val)+'"'+(cur===val?" checked":"")+'><span><b>'+esc(label)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</span></label>';}
  var offers=Object.keys(OFFERS).map(function(k){return '<label class="opt"><input type="checkbox" name="offer" value="'+k+'"'+(setup.offers[k]?" checked":"")+'><span><b>'+OFFERS[k].label+'</b><small>'+OFFERS[k].desc+'</small></span></label>';}).join("");
  var origins=ORIGINS.map(function(o){return radio("origin",o.id,setup.origin,o.label,o.sub);}).join("");
  return '<div class="setup-head"><div class="brandmark">mind<span>flight</span>7</div>'+
    '<h1 class="title" style="margin-top:18px">Booking page mockup: test setup</h1>'+
    '<p class="lede">Pick a starting point, then go through the booking as a teacher would. Change any setting and run it again to compare. This page is for the team only; schools never see it.</p></div>'+
    '<div class="shell"><div class="setup-grid">'+
      '<section class="panel"><h2 class="h3">Where the teacher clicked Book</h2><p class="hint">Sets the flight that comes pre-filled.</p><div class="opt-list">'+origins+'</div></section>'+
      '<div style="display:grid;gap:20px;align-content:start">'+
        '<section class="panel"><h2 class="h3">Offers running</h2><p class="hint">Sample offers. Each one applies automatically when its condition is met.</p><div class="opt-list">'+offers+'</div>'+
          '<h3 class="h3" style="margin-top:18px">When more than one offer applies</h3><div class="opt-list">'+
          radio("stacking","stack",setup.stacking,"Stack them all","Each offer applies to the price left after the one before")+
          radio("stacking","best",setup.stacking,"Best single offer only","The biggest discount wins; the free PD session always stays")+'</div></section>'+
        '<section class="panel"><h2 class="h3">How the price is shown</h2><div class="opt-list">'+
          radio("cart","on",setup.cart?"on":"off","Shopping cart","Running cart while choosing, full price before they book")+
          radio("cart","off",setup.cart?"on":"off","Quote","No price on the page; a quote arrives after they send the request")+'</div></section>'+
        '<section class="panel"><h2 class="h3">Weekend dates</h2><div class="opt-list">'+
          radio("weekend","instant",setup.weekend,"Bookable instantly","")+
          radio("weekend","rep",setup.weekend,"Arranged with our team","Picking a Saturday or Sunday opens the date prompt")+
          radio("weekend","off",setup.weekend,"Not offered","Still opens the date prompt, never a dead end")+'</div>'+
          '<label class="f" style="margin-top:18px">Students per day, per state <span class="optional">(placeholder)</span><input class="input" type="number" min="20" step="10" name="dailyCap" value="'+esc(setup.dailyCap)+'"></label></section>'+
      '</div>'+
      '<section class="panel"><h2 class="h3">Sample values in this mockup</h2><table class="ref"><tbody>'+
        '<tr><td>30 / 45 / 60 / 90 minutes, per student</td><td>$14 / $18 / $22 / $27.50</td></tr>'+
        '<tr><td>Custom length or custom workshop</td><td>Quoted by our team</td></tr>'+
        '<tr><td>Minimum booking</td><td>$880 ex GST</td></tr>'+
        '<tr><td>Students per session</td><td>NSW 30, VIC 50, WA 34, SA 30, QLD 40, other 30</td></tr>'+
        '<tr><td>Travel</td><td>Free to 50 km, then $1.50/km each way, capped at $300</td></tr>'+
        '<tr><td>Notice for instant booking</td><td>14 days</td></tr>'+
        '<tr><td>Free Teacher PD session value</td><td>$440</td></tr>'+
      '</tbody></table><p class="hint">Flights, schools and booked-out dates are made up for testing.</p></section>'+
      '<section class="panel"><h2 class="h3">Things to try</h2><ul class="tries">'+
        '<li>Pick Wed 18 Nov 2026: fully booked everywhere.</li>'+
        '<li>Pick Thu 19 Nov 2026 with 50 students: only 40 places left.</li>'+
        '<li>Riverbend Primary (VIC) on Tue 3 Nov 2026: Melbourne Cup Day.</li>'+
        '<li>Goldfields Secondary College, Ballarat: travel fee.</li>'+
        '<li>Derwent Valley Primary (TAS): outside our states, becomes a request.</li>'+
        '<li>Set 44 students to see the group discount nudge.</li>'+
        '<li>Enter code TERM4 at the price step.</li>'+
        '<li>Leave halfway with "Save and finish later" to see the reminder email.</li>'+
      '</ul><div class="actions" style="margin-top:20px"><button type="button" class="btn ghost" data-act="previewEmail">Preview the reminder email</button></div></section>'+
    '</div><div class="actions"><span class="hint">Settings stay as they are until you change them.</span><button type="button" class="btn" data-act="start">Start booking as a teacher</button></div></div>';
}

/* ---------- step 1 ---------- */
function step1HTML(){
  var f=form;
  return '<h1 class="title">Let\'s start with you</h1><p class="lede">So we know who to send the confirmation to. It takes about two minutes from here.</p>'+
  '<div class="fields">'+
    field("first","First name",f.first,"text","given-name")+
    field("last","Last name",f.last,"text","family-name")+
    field("email","School email",f.email,"email","email")+
    field("phone","Mobile",f.phone,"tel","tel")+
    '<label class="f full">Your role<select class="select" name="role"><option value="">Choose your role</option>'+
      ROLES.map(function(r){return '<option'+(f.role===r?" selected":"")+'>'+esc(r)+'</option>';}).join("")+
    '</select><div class="err" data-err="role"></div></label>'+
    '<label class="check full"><input type="checkbox" name="remind"'+(f.remind?" checked":"")+'><span>If I don\'t finish, email me a link to pick up where I left off.</span></label>'+
    '<label class="check full"><input type="checkbox" name="news"'+(f.news?" checked":"")+'><span>Send me occasional news and offers from Mindflight7.</span></label>'+
  '</div>'+
  '<div class="actions"><span class="hint">We only use these details for this booking.</span><button type="button" class="btn" data-act="next1">Continue to your school</button></div>';

function groupNudgeHTML(){
  var n=+form.students||0;
  if (!setup.offers.group||quoteOnly()){forget("p:group");forget("d:group");return '';}
  if (n>=50){forget("d:group");var a=offerAmt(pricing(),"group");return perk("group","25%","Group discount unlocked"+(showMoney()&&a?". You save "+money(a):""));}
  forget("p:group");

  else if (showMoney()&&offerAmt(w,"group")) text="Add "+add+" more students and take <b>"+money(offerAmt(w,"group"))+"</b> off the whole booking.";

function nearestOffpeak(s){var o=parse(s);for(var k=1;k<=10;k++){var c=[addDays(o,-k),addDays(o,k)];for(var j=0;j<2;j++){var d=c[j];if(d<TODAY)continue;if((d.getDay()===1||d.getDay()===5)&&availability(iso(d)).ok)return iso(d);}}return null;}
function dateNudgeHTML(){
  if (quoteOnly()) return '';

    var ed=niceShort(iso(addDays(TODAY,EARLY_DAYS)));

      out.push(deal("early","10% off","Book from "+ed+" and get the early bird discount"+(showMoney()&&est?", about <b>"+money(est)+"</b> off.":"."),"Show early bird dates","showEarly"));}
  }
  if (o.offpeak && d){
    if (d.getDay()===1||d.getDay()===5){forget("d:offpeak");var b=offerAmt(now,"offpeak");out.push(perk("offpeak","10%",DOW[d.getDay()]+" saver unlocked"+(showMoney()&&b?". You save "+money(b):"")));}

  }

}

function calendarHTML(mode,month){
  var y=month.getFullYear(), m=month.getMonth(), first=new Date(y,m,1), start=first.getDay();
  var days=new Date(y,m+1,0).getDate(), cells="";
  var prevOk = new Date(y,m,1) > new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  for (var i=0;i<start;i++) cells+='<span></span>';
  for (var dnum=1; dnum<=days; dnum++){
    var d=new Date(y,m,dnum), s=iso(d), dis=false, cls="day";

    if (mode==="avail" && !dis) dis=!availability(s).ok;

    cells+='<button type="button" class="'+cls+'" data-day="'+s+'" data-mode="'+mode+'"'+(dis?" disabled":"")+' aria-label="'+nice(s)+'">'+dnum+'</button>';
  }

    '<div class="cal-grid">'+DOW.map(function(x){return '<span class="dow">'+x.charAt(0)+'</span>';}).join("")+cells+'</div>'+

    (mode==="open" && form.showEarly && setup.offers.early && !quoteOnly() ? '<div class="cal-legend"><i style="background:none;border:2px solid var(--brand);width:10px;height:10px;border-radius:3px"></i>Outlined dates get the early bird discount</div>':'')+

    var li=lines[i]; li.classList.add("in");

      if (li.dataset.offer){ var o=pr.offers.filter(function(x){return x.key===li.dataset.offer;})[0]; var from=running; running=round2(running-o.amt); countTo(big,from,running); }

function countTo(el,from,to){

  var t0=null,dur=500;

  requestAnimationFrame(f);
}

function onInput(e){

  if (t.dataset.year){ var y=t.dataset.year,i=form.years.indexOf(y); if(i>-1)form.years.splice(i,1); else form.years.push(y); t.setAttribute("aria-pressed",i<0); return; }

  if (t.dataset.school){ var s=SCHOOLS[+t.dataset.school]; form.school=Object.assign({},s); form.manual=false; render(); toast("School added: "+s.name); return; }
  if (t.dataset.call){ form.callTime=t.dataset.call; $$("[data-call]").forEach(function(b){b.setAttribute("aria-pressed",b===t);}); return; }

  if (!act) return;
  switch(act){
    case "start": form=freshForm(); applyOrigin(); calMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1); view=1; render(); break;
    case "previewEmail": openModal('<h2 class="title" style="font-size:24px">Reminder email</h2><p class="hint">Sent if a teacher leaves after step 1 and ticked the reminder box. Wording changes with the price setting.</p>'+emailPreviewHTML(true)); break;

    case "searchAgain": form.manual=false; form.school=null; render(); break;
    case "changeSchool": form.school=null; form.manual=false; render(); break;
    case "next2":
      if (form.manual && !validateManual()) break;
      if (!form.school){ var q=$('[name="schoolq"]'); if(q){q.classList.add("bad");q.focus();} toast("Choose your school, or enter its details."); break; }
      if (form.date) recheckDateSilently();

    case "back": view=view-1; render(); break;

    case "backFromSkip": form.skipped=false; view=3; render(); break;
    case "sendSkip": runLoading([{t:"Sending your request",ms:900,after:"Sent to our bookings team"}],function(){view="requested";render();}); break;
    case "clearFlight": form.flight=null; keepScroll(render); break;
    case "stu-": form.students=Math.max(1,(+form.students||0)-1); form.sessionsWanted=0; $('[name="students"]').value=form.students; refresh3(); recheckDate(); break;
    case "stu+": form.students=Math.min(600,(+form.students||0)+1); form.sessionsWanted=0; $('[name="students"]').value=form.students; refresh3(); recheckDate(); break;
    case "ses-": var p=sessionPlan(); form.sessionsWanted=Math.max(p.minS,p.count-1); refresh3(); break;
    case "ses+": var p2=sessionPlan(); form.sessionsWanted=Math.min(p2.count+1,8); refresh3(); break;
    case "takeGroup": form.students=50; form.sessionsWanted=0; var si=$('[name="students"]'); if(si) si.value=50; refresh3(); recheckDate(); toast("50 students. Group discount unlocked."); break;
    case "showEarly": form.showEarly=true; var edd=addDays(TODAY,EARLY_DAYS); calMonth=new Date(edd.getFullYear(),edd.getMonth(),1); redrawCal(); var cc=$("#calOpen"); if(cc) cc.scrollIntoView({behavior:reduced?"auto":"smooth",block:"center"}); toast("Dates from "+niceShort(iso(edd))+" are 10% off. Pick one."); break;
    case "takeOffpeak": if(form._offpeakCand){ var cd=parse(form._offpeakCand); calMonth=new Date(cd.getFullYear(),cd.getMonth(),1); pickDate(form._offpeakCand); } break;
    case "reopenDate": dateModal(form.date,availability(form.date)); break;
    case "keepDate": form.dateRequest=true; form.dateStatus="request"; closeModal(); redrawCal(); $("#dateStatus").innerHTML=dateStatusHTML(); refresh3(); break;
    case "next3": if (validate3()){ if(setup.cart){ runLoading(priceSteps(),function(){view=4;render();playReveal();}); } else { view=4; render(); } } break;
    case "goto3": view=3; render(); break;
    case "applyPromo": applyPromo(); break;
    case "confirm":
      if (!form.terms){ setErr("terms","Tick to agree to the booking terms."); var tb=$('[name="terms"]'); if(tb){ tb.scrollIntoView({behavior:reduced?"auto":"smooth",block:"center"}); tb.focus(); } toast("Tick the booking terms to confirm."); break; }
      if (isRequest()) runLoading([{t:"Sending your request",ms:900,after:"Sent to our bookings team"}],function(){view="requested";render();});
      else { view="confirming"; runLoading([{t:"Holding your date",ms:700,after:"Held"},{t:"Creating your invoice",ms:900,after:"Emailed to "+form.email},{t:"Inviting your crew",ms:700,after:"Done"}],function(){view="done";render();}); }
      break;
    case "sendRequest": runLoading(priceSteps(),function(){view="requested";render();playReveal();}); break;
    case "acceptQuote": runLoading([{t:"Holding your date",ms:700,after:"Held"},{t:"Creating your invoice",ms:900,after:"Emailed to "+form.email}],function(){view="done";render();}); break;
    case "callMe": form.skipped=true; form.callTime=form.callTime||"Morning"; view="skip"; render(); break;
    case "saveLater": saveLater(); break;
    case "closeModal": closeModal(); break;
    case "payNow": var pr2=pricing(); openModal('<h2 class="title" style="font-size:24px">Pay invoice '+invoiceNo()+'</h2><p class="lede">'+(pr2?money(pr2.total):'')+' inc GST. In the live version this opens your invoice in Xero.</p><div class="split" style="grid-template-columns:1fr 1fr"><div class="side"><h3 class="h3">Pay by card</h3><p class="hint">Visa, Mastercard or Amex through a secure payment page. Nothing is stored by Mindflight7.</p><div class="actions" style="margin-top:14px"><button type="button" class="btn" data-act="fakePay">Pay '+(pr2?money(pr2.total):'')+'</button></div></div><div class="side alt"><h3 class="h3">Bank transfer</h3><dl class="kv"><div><dt>BSB</dt><dd>000-000</dd></div><div><dt>Account</dt><dd>0000 0000</dd></div><div><dt>Reference</dt><dd>'+invoiceNo()+'</dd></div></dl><p class="hint">Sample details for the mockup.</p></div></div>'); break;
    case "fakePay": closeModal(); var chip=$(".paid-chip"); if(chip){chip.textContent="Paid";chip.classList.add("is-paid");} toast("Payment received. A receipt is on its way (mockup)."); break;
    case "forwardFinance": openModal('<h2 class="title" style="font-size:24px">Send to your finance team</h2><p class="lede">We\'ll email them the invoice and booking details so they can pay directly.</p><label class="f">Finance email<input class="input" name="financeEmail" type="email" placeholder="accounts@school.edu.au"></label><div class="actions"><button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button type="button" class="btn" data-act="sendFinance">Send invoice</button></div>'); break;
    case "sendFinance": var fe=$('[name="financeEmail"]'); var fv=fe?fe.value.trim():""; if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fv)){ if(fe){fe.classList.add("bad");fe.focus();} break;} closeModal(); toast("Invoice sent to "+fv+" (mockup)."); break;
    case "pdTimes": toast("Our team will email you PD session times this week (mockup)."); break;
    case "parentNote": toast("Note for families downloaded (mockup)."); break;
    case "calAdd": toast("Calendar invite downloaded (mockup)."); break;
    case "again": view="setup"; render(); break;
  }
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape" && $("#scrim")) closeModal(); });
$("#toSetup").addEventListener("click",function(){ closeModal(); view="setup"; render(); });

function keepScroll(fn){ var y=window.scrollY; fn(); window.scrollTo(0,y); }
function recheckDateSilently(){ var a=availability(form.date); if(!form.dateRequest) form.dateStatus=a.ok?"ok":"no"; }
function chooseAvail(s){
  form.date=s; form.dateRequest=false; form.dateStatus="ok"; closeModal();
  calMonth=new Date(parse(s).getFullYear(),parse(s).getMonth(),1);
  redrawCal(); $("#dateStatus").innerHTML=dateStatusHTML(); refresh3();
  toast(nice(s)+" is yours to book.");
}
function applyOrigin(){
  if (setup.origin==="custom-workshop"){ form.type="workshop"; form.length="custom"; form.flight=null; return; }
  var f=FLIGHTS.filter(function(x){return x.slug===setup.origin;})[0];
  if (f){ form.type=f.type; form.flight=f.slug; form.length=f.lengths.indexOf(60)>-1?60:f.lengths[0]; }
}
function validate3(){
  if (form.type!=="workshop" && !form.flight){ toast("Choose a flight, or pick Not sure yet."); return false; }
  if (form.type==="workshop" && !form.brief.trim()){ toast("Tell us a little about the workshop."); var b=$('[name="brief"]'); if(b){b.classList.add("bad");b.focus();} return false; }
  if (!(+form.students>0)){ toast("Enter the number of students."); return false; }
  if (!form.date){ toast("Choose a preferred date."); var c=$("#calOpen"); if(c) c.scrollIntoView({behavior:reduced?"auto":"smooth",block:"center"}); return false; }
  if (form.dateStatus==="checking") return false;
  var a=availability(form.date);
  if (!a.ok && !form.dateRequest){ dateModal(form.date,a); return false; }
  return true;
}
function applyPromo(){
  var v=(form.promo||"").trim().toUpperCase();
  if (v==="TERM4"){ form.promoApplied="TERM4"; setErr("promo","");
    if (view===4 && setup.cart){ keepScroll(function(){render();}); var lines=$$("#reveal .line"); lines.forEach(function(l){l.classList.add("in");}); var pr=pricing(); var big=$("#bigTotal"); if(big&&pr){ big.textContent=money(pr.total); } var sb=$("#saveBanner"); if(sb&&sb.textContent) sb.classList.add("in"); toast("TERM4 applied: 15% off."); }
    else toast("TERM4 will be applied to your quote.");
  } else if (!v){ setErr("promo","Enter a code first."); }
  else { setErr("promo","That code isn't valid. Check the spelling, or leave it blank."); }
}
function saveLater(){
  if (!form.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)){
    openModal('<h2 class="title" style="font-size:24px">Save your booking</h2><p class="lede">Add your email on this step and we\'ll send you a link to finish later.</p><div class="actions"><button type="button" class="btn" data-act="closeModal">Okay</button></div>');
    return;
  }
  openModal('<h2 class="title" style="font-size:24px">Saved for later</h2><p class="lede">We\'ve emailed a link to '+esc(form.email)+'. If you don\'t come back, this is the reminder you\'d get the next day.</p>'+emailPreviewHTML(false));
}

/* ---------- boot ---------- */
form=freshForm(); view="setup"; calMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
render();
})();
</script>
</body>
</html>
